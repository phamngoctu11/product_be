name: workflow-dev

services:
  redis:
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"

  mongo:
    ports:
      - "${MONGO_PUBLISHED_PORT:-27017}:27017"

  keycloak:
    ports:
      - "${KEYCLOAK_PUBLISHED_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-export-dev.json:/opt/keycloak/data/import/realm-export.json:ro

  backend:
    ports: !override
      - "${BACKEND_PUBLISHED_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/my-workflow-dev}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-my-workflow-dev}
      KEYCLOAK_BOOTSTRAP_MANAGER_ENABLED: ${KEYCLOAK_BOOTSTRAP_MANAGER_ENABLED:-true}
      KEYCLOAK_BOOTSTRAP_MANAGER_USERNAME: ${KEYCLOAK_BOOTSTRAP_MANAGER_USERNAME:-manager}
      KEYCLOAK_BOOTSTRAP_MANAGER_PASSWORD: ${KEYCLOAK_BOOTSTRAP_MANAGER_PASSWORD:-manager123}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql-2e217108-tup20658-b458.g.aivencloud.com:20481/defaultdb?ssl-mode=REQUIRED}
      DB_USERNAME: ${DB_USERNAME:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD:-AVNS_YtHzX3-c_Way8m2h4WI}

  frontend:
    ports: !override
      - "${FRONTEND_PUBLISHED_PORT:-4200}:80"
