name: workflow-prod

services:
  redis:
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"

  mongo:
    ports:
      - "${MONGO_PUBLISHED_PORT:-27017}:27017"

  keycloak:
    ports:
      - "${KEYCLOAK_PUBLISHED_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  backend:
    ports: !override
      - "${BACKEND_PUBLISHED_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/my-workflow}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-my-workflow}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://165.245.188.101}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://165.245.188.101}
      DB_URL: ${DB_URL:-jdbc:mysql://103.149.170.20:3306/db_A46623}
      DB_USERNAME: ${DB_USERNAME:-A46623}
      DB_PASSWORD: ${DB_PASSWORD:-A46623@thanglong}

  frontend:
    ports: !override
      - "${FRONTEND_PUBLISHED_PORT:-80}:80"
