services:
  redis:
    image: redis:7.2-alpine
    container_name: workflow-redis
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7.0
    container_name: workflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: workflow-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data

  backend:
    build: .
    container_name: workflow-backend
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - mongo
      - keycloak
    environment:
      - REDIS_HOST=redis
      - MONGODB_URI=mongodb://mongo:27017/workflow_chat
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/my-workflow
      - APP_CORS_ALLOWED_ORIGINS=http://165.245.188.101
      - DB_URL=jdbc:mysql://103.149.170.20:3306/db_A46623
      - DB_USERNAME=A46623
      - DB_PASSWORD=A46623@thanglong

  frontend:
    image: nginx:alpine
    container_name: workflow-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../fe_product/dist/fe_product/browser:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  redis_data:
  mongo_data:
  keycloak_data:
