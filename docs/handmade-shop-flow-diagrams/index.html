<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sơ đồ luồng shop handmade</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    h1 { margin: 0 0 8px; color: #f8fafc; }
    p { color: #cbd5e1; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }
    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
    }
    .card h2 { margin: 0 0 12px; color: #f8fafc; }
    .links { margin-bottom: 14px; }
    a {
      color: #38bdf8;
      text-decoration: none;
      margin-right: 16px;
      font-weight: 700;
    }
    a:hover { text-decoration: underline; }
    img {
      width: 100%;
      max-height: 900px;
      object-fit: contain;
      background: #0f172a;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Sơ đồ luồng shop handmade</h1>
  <p>Bộ sơ đồ tổng hợp định hướng triển khai: user, guest, Redis Cache/Stream và Camunda.</p>

  <div class="grid">
    <section class="card">
      <h2>01. Tổng quan</h2>
      <div class="links"><a href="./01-overview.svg" download>Tải SVG</a><a href="./01-overview.svg" target="_blank">Mở riêng</a></div>
      <img src="./01-overview.svg" alt="Tổng quan luồng shop handmade">
    </section>

    <section class="card">
      <h2>02. Luồng user hệ thống</h2>
      <div class="links"><a href="./02-user-flow.svg" download>Tải SVG</a><a href="./02-user-flow.svg" target="_blank">Mở riêng</a></div>
      <img src="./02-user-flow.svg" alt="Luồng user hệ thống">
    </section>

    <section class="card">
      <h2>03. Luồng non-user / guest</h2>
      <div class="links"><a href="./03-guest-flow.svg" download>Tải SVG</a><a href="./03-guest-flow.svg" target="_blank">Mở riêng</a></div>
      <img src="./03-guest-flow.svg" alt="Luồng non-user guest">
    </section>

    <section class="card">
      <h2>04. Redis / Camunda mapping</h2>
      <div class="links"><a href="./04-redis-camunda-mapping.svg" download>Tải SVG</a><a href="./04-redis-camunda-mapping.svg" target="_blank">Mở riêng</a></div>
      <img src="./04-redis-camunda-mapping.svg" alt="Redis Camunda mapping">
    </section>
  </div>
</body>
</html>
