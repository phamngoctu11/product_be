    <text x="800" y="884" text-anchor="middle" font-size="18" font-weight="700">CUSTOM: timer 24 giờ từ managerApprovedAt, dừng khi form hợp lệ được lưu.</text>
    <text x="800" y="919" text-anchor="middle" font-size="17">Guest CATALOG bỏ qua chat/form và dùng snapshot catalog sau khi có staff.</text>
    <text x="800" y="954" text-anchor="middle" font-size="17">Kết quả: ORDER_ACCEPTED để bàn giao WF04 hoặc CANCELLED do timeout.</text>
    <text x="800" y="997" text-anchor="middle" font-size="15" fill="#526072">Camunda là thành phần nội bộ nên không vẽ thành actor. Đường nối không thể hiện thứ tự thực hiện.</text>
