<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Use Case tổng quát WF03 — Phân công và xác nhận đơn</title>
  <desc id="desc">Manager chỉ phân công staff. Staff tự nhận đơn, trao đổi và xác nhận thỏa thuận. Phòng chat chỉ dành cho User sở hữu đơn và Staff phụ trách.</desc>
  <rect width="1600" height="1050" fill="white"/>
  <g font-family="Arial, 'Segoe UI', sans-serif" fill="#172033">
    <text x="800" y="44" font-size="27" font-weight="700" text-anchor="middle">BIỂU ĐỒ USE CASE TỔNG QUÁT</text>
    <text x="800" y="78" font-size="21" text-anchor="middle">WF03 — Phân công và xác nhận đơn</text>

    <rect x="320" y="112" width="960" height="720" fill="#fbfcfe" stroke="#374151" stroke-width="2"/>
    <path d="M320 156 H870 L892 134 V112" fill="none" stroke="#374151" stroke-width="1.5"/>
    <text x="344" y="142" font-size="18" font-weight="700">Shop handmade — WF03 agree_order</text>

    <g fill="none" stroke="#374151" stroke-width="1.8">
      <path d="M203 237 L485 235"/>
      <path d="M203 501 L485 515"/>
