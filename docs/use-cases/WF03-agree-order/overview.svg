    <g text-anchor="middle" font-size="18">
      <text x="165" y="345" font-weight="700">Quản lý</text><text x="165" y="370">MANAGER</text>
      <text x="165" y="609" font-weight="700">Khách có tài khoản</text><text x="165" y="634">USER</text>
