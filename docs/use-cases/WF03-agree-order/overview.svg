      <ellipse cx="800" cy="775" rx="315" ry="42"/>
    </g>

    <g text-anchor="middle" font-size="19">
      <text x="800" y="222" font-weight="700">UC03.1</text><text x="800" y="251">Manager phân công staff</text>
      <text x="800" y="382" font-weight="700">UC03.2</text><text x="800" y="411">Staff tự nhận đơn</text>
      <text x="800" y="502" font-weight="700">UC03.3</text><text x="800" y="531">Truy cập và trao đổi trong phòng chat</text>
      <text x="800" y="662" font-weight="700">UC03.4</text><text x="800" y="691">User gửi form thông tin thỏa thuận</text>
      <text x="800" y="770" font-weight="700">UC03.5</text><text x="800" y="796">Staff xác nhận hoặc yêu cầu sửa</text>
    </g>

    <g fill="none" stroke="#263244" stroke-width="2.6" stroke-linecap="round">
      <circle cx="165" cy="193" r="19"/><path d="M165 212 V276 M127 237 H203 M165 276 L137 315 M165 276 L193 315"/>
