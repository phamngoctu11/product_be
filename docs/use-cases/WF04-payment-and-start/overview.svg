    <g text-anchor="middle" font-size="18">
      <text x="163" y="355" font-weight="700">Khách có tài khoản</text><text x="163" y="380">USER</text>
      <text x="163" y="645" font-weight="700">Nhân viên phụ trách</text><text x="163" y="670">STAFF</text>
      <text x="1237" y="515" font-weight="700">Cổng thanh toán</text><text x="1237" y="540" font-size="15">Tác nhân hệ thống ngoài</text>
    </g>

    <text x="700" y="738" text-anchor="middle" font-size="18" font-weight="700">COD bỏ qua UC04.1–UC04.2 và đi thẳng tới task chờ staff bắt đầu.</text>
    <text x="700" y="775" text-anchor="middle" font-size="17">Webhook PAID chỉ thông báo, Order vẫn ORDER_ACCEPTED.</text>
    <text x="700" y="812" text-anchor="middle" font-size="17">Chỉ staff phụ trách bấm bắt đầu mới chuyển ORDER_CREATING.</text>
    <text x="700" y="860" text-anchor="middle" font-size="15" fill="#526072">Camunda, timer, database và notification consumer là thành phần nội bộ nên không vẽ thành actor.</text>
  </g>
