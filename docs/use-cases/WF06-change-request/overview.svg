<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Use Case tổng quát WF06 — Yêu cầu thay đổi chi tiết</title>
  <desc id="desc">User sở hữu đơn tạo yêu cầu thay đổi và staff phụ trách chấp nhận hoặc từ chối. Manager và Guest không tham gia.</desc>
  <rect width="1300" height="760" fill="white"/>
  <g font-family="Arial, 'Segoe UI', sans-serif" fill="#172033">
    <text x="650" y="44" font-size="27" font-weight="700" text-anchor="middle">BIỂU ĐỒ USE CASE TỔNG QUÁT</text>
    <text x="650" y="78" font-size="21" text-anchor="middle">WF06 — Yêu cầu thay đổi chi tiết</text>

    <rect x="300" y="112" width="700" height="410" fill="#fbfcfe" stroke="#374151" stroke-width="2"/>
    <path d="M300 156 H770 L792 134 V112" fill="none" stroke="#374151" stroke-width="1.5"/>
    <text x="324" y="142" font-size="18" font-weight="700">Shop handmade — WF06 change_request</text>

    <g fill="none" stroke="#374151" stroke-width="1.8">
      <path d="M191 267 L425 255"/>
      <path d="M1109 407 L875 395"/>
    </g>

    <g fill="white" stroke="#374151" stroke-width="1.8">
      <ellipse cx="650" cy="255" rx="225" ry="64"/>
      <ellipse cx="650" cy="395" rx="225" ry="64"/>
    </g>

    <g text-anchor="middle" font-size="19">
      <text x="650" y="226" font-weight="700">UC06.1</text>
      <text x="650" y="255">Tạo yêu cầu</text><text x="650" y="281">thay đổi</text>
      <text x="650" y="366" font-weight="700">UC06.2</text>
      <text x="650" y="395">Quyết định yêu cầu</text><text x="650" y="421">thay đổi</text>
    </g>

    <g fill="none" stroke="#263244" stroke-width="2.6" stroke-linecap="round">
      <circle cx="153" cy="223" r="19"/><path d="M153 242 V306 M115 267 H191 M153 306 L125 345 M153 306 L181 345"/>
      <circle cx="1147" cy="363" r="19"/><path d="M1147 382 V446 M1109 407 H1185 M1147 446 L1119 485 M1147 446 L1175 485"/>
    </g>

    <g text-anchor="middle" font-size="18">
      <text x="153" y="375" font-weight="700">Khách có tài khoản</text><text x="153" y="400">USER</text>
      <text x="1147" y="515" font-weight="700">Nhân viên phụ trách</text><text x="1147" y="540">STAFF</text>
    </g>

    <text x="650" y="580" text-anchor="middle" font-size="18" font-weight="700">Chỉ thay đổi chi tiết chưa triển khai.</text>
    <text x="650" y="617" text-anchor="middle" font-size="17">Không đổi giá, voucher, payment, deadline hoặc Order status.</text>
    <text x="650" y="654" text-anchor="middle" font-size="17">MANAGER và Guest không tham gia WF06.</text>
    <text x="650" y="706" text-anchor="middle" font-size="15" fill="#526072">Camunda là task phụ không ngắt main flow nên không vẽ thành actor.</text>
  </g>
</svg>
