
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/my-workflow-dev}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

keycloak:
  realm: ${KEYCLOAK_REALM:my-workflow-dev}

momo:
  redirectUrl: ${MOMO_REDIRECT_URL:http://localhost:4200/payment-success}
