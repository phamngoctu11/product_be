server:
  port: 8080
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-credential:
      threshold: ${APP_RATE_LIMIT_LOGIN_CREDENTIAL_THRESHOLD:5}
      base-lock-minutes: ${APP_RATE_LIMIT_LOGIN_CREDENTIAL_BASE_LOCK_MINUTES:3}
      lock-increment-minutes: ${APP_RATE_LIMIT_LOGIN_CREDENTIAL_LOCK_INCREMENT_MINUTES:1}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
chat:
  realtime:
    redis-pubsub:
      enabled: ${CHAT_REALTIME_REDIS_PUBSUB_ENABLED:false}
  migration:
    mysql-to-mongo:
      enabled: ${CHAT_MIGRATION_MYSQL_TO_MONGO_ENABLED:false}
consultation:
  bonus:
    percent: ${CONSULTATION_BONUS_PERCENT:5}
workflow:
  events:
    redis-stream:
      enabled: ${WORKFLOW_EVENTS_REDIS_STREAM_ENABLED:true}
      group: ${WORKFLOW_EVENTS_REDIS_STREAM_GROUP:workflow-domain-event-workers}
      consumer-name: ${WORKFLOW_EVENTS_REDIS_STREAM_CONSUMER_NAME:${spring.application.name:workflow-app}}
      batch-size: ${WORKFLOW_EVENTS_REDIS_STREAM_BATCH_SIZE:20}
      poll-delay-ms: ${WORKFLOW_EVENTS_REDIS_STREAM_POLL_DELAY_MS:1000}
checkout:
  lock:
    wait-ms: ${CHECKOUT_LOCK_WAIT_MS:1000}
    lease-ms: ${CHECKOUT_LOCK_LEASE_MS:15000}
    retry-delay-ms: ${CHECKOUT_LOCK_RETRY_DELAY_MS:50}
    variant-enabled: ${CHECKOUT_VARIANT_LOCK_ENABLED:true}
  idempotency:
    in-progress-ttl-ms: ${CHECKOUT_IDEMPOTENCY_IN_PROGRESS_TTL_MS:900000}
    response-ttl-ms: ${CHECKOUT_IDEMPOTENCY_RESPONSE_TTL_MS:86400000}
  reservation-timeout:
    enabled: ${CHECKOUT_RESERVATION_TIMEOUT_ENABLED:true}
    minutes: ${CHECKOUT_RESERVATION_TIMEOUT_MINUTES:15}
    scan-delay-ms: ${CHECKOUT_RESERVATION_TIMEOUT_SCAN_DELAY_MS:60000}
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:my-workflow}
  client-id: ${KEYCLOAK_CLIENT_ID:workflow-frontend}
  admin:
    realm: ${KEYCLOAK_ADMIN_REALM:master}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
spring:
  application:
    name: my-workflow-app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/my-workflow}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:tup20658@gmail.com}
    password: ${MAIL_PASSWORD:eoyi rxsi qquw xmhs}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL:jdbc:mysql://103.149.170.20:3306/db_A46623}
    username: ${DB_USERNAME:A46623}
    password: ${DB_PASSWORD:A46623@thanglong}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/workflow_chat}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:false}
    redis:
      # Chạy local sẽ dùng localhost, chạy docker compose sẽ dùng biến REDIS_HOST=redis
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 10000
      fail-on-error: true
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update

camunda.bpm:
  deployment-resource-pattern:
    - classpath*:**/*.bpmn
  database:
    schema-update: true
  admin-user:
    id: ${CAMUNDA_ADMIN_ID:admin}
    # Đã thêm fallback cho password để không báo lỗi khi khởi chạy local
    password: ${CAMUNDA_ADMIN_PASSWORD:admin}
    first-name: ${CAMUNDA_ADMIN_FIRST_NAME:Admin}
    last-name: ${CAMUNDA_ADMIN_LAST_NAME:User}
    email: ${CAMUNDA_ADMIN_EMAIL:admin@example.com}
  generic-properties:
    enforce-history-time-to-live: false

